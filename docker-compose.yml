services:
  lets-backend:
    build: .
    image: lets:dev
    container_name: lets-backend
    ports:
      - "8000:8000"
    volumes:
      - lets-data:/data
    environment:
      - LETS_DB_PATH=/data/lets.db
      - LETS_GIT_REPO=/data/lets-artifacts
      - LETS_UPLOAD_DIR=/data/lets-uploads
      - LETS_FRONTEND_DIST=/app/frontend/dist
      - LETS_COOKIE_SECURE=false
    restart: unless-stopped

volumes:
  lets-data:
